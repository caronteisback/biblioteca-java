spring:
  application:
    name: biblioteca-java
  profiles:
    # Used only when no profile is set explicitly. Tests activate "test".
    default: dev
  config:
    # Lets the same .env file feed docker compose and Spring (KEY=VALUE, no quotes).
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the only owner of the schema; Hibernate just verifies it.
      ddl-auto: validate
  flyway:
    enabled: true
  web:
    # Fixed locale so validation messages are always English, whatever the machine or the client sends.
    locale: en
    locale-resolver: fixed

# Business parameters (see docs/business-rules.md, section 3). Change them here, not in code.
# max-renovaciones cannot exceed 3: the schema has a CHECK constraint with that bound.
biblioteca:
  zona-horaria: America/Lima
  prestamo:
    dias-plazo: 14
    max-activos: 5
    max-renovaciones: 3
    alerta-dias-previos: 2
  multa:
    por-dia: 1.00
  score:
    inicial: 100
    penalizacion-base: 10
    penalizacion-por-dia: 1
    umbral-bloqueo: 50
  cors:
    # Origins of the browser frontend (scheme://host[:port], no wildcard). Local development servers
    # by default; override with BIBLIOTECA_CORS_ORIGENES_PERMITIDOS=https://a.example,https://b.example
    origenes-permitidos:
      - http://localhost:5500
      - http://127.0.0.1:5500
      - http://localhost:3000
      - http://localhost:8000
      - http://localhost:5173
      - http://127.0.0.1:5173

# The API description and Swagger UI are off by default. The dev profile turns them on; a real
# deployment keeps them off unless it decides to publish them.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    # Keeps the tags and operations in the order of the document instead of re-sorting them in the browser.
    operations-sorter: method
  # A stable key order, so the exported openapi.yaml only changes when the API changes.
  writer-with-order-by-keys: true
  override-with-generic-response: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Never leak internal details (driver, URL, validation query) to clients.
      show-details: never

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
