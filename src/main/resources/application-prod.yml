# Profile for the container and any real deployment. Everything comes from the environment:
# this file holds no value and no default for a secret, so a missing variable stops the startup.
#   DB_URL            jdbc:oracle:thin:@//<host>:1521/<service>
#   APP_USER          database user of the application (never SYS or SYSTEM)
#   APP_USER_PASSWORD its password
spring:
  datasource:
    url: ${DB_URL}
    username: ${APP_USER}
    password: ${APP_USER_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
