name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository. It needs no token with write access and no secret.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on Oracle XE (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Same image as docker-compose.yml, from ghcr.io: Docker Hub limits anonymous pulls from shared runners.
      ORACLE_XE_IMAGE: ghcr.io/gvenzl/oracle-xe:21-slim-faststart
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and run every test
        run: ./mvnw -B verify
      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

  docker:
    name: The Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the image (not pushed anywhere)
        run: docker build -t biblioteca-java:ci .
