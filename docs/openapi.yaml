              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error. Possible codes: `CONCURRENT_UPDATE`."
        "500":
          content:
            application/json:
              examples:
                INTERNAL_ERROR:
                  $ref: "#/components/examples/INTERNAL_ERROR"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error. Possible codes: `INTERNAL_ERROR`."
      summary: Bring a retired copy back
      tags:
      - Copies
  /api/v1/ejemplares/{id}/baja:
    post:
      description: For a damaged or lost copy. A copy that is on loan cannot be retired.
        Retiring twice is harmless.
      operationId: retireCopy
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EjemplarResponse"
          description: OK
        "400":
