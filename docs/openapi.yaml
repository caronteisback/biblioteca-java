  /api/v1/multas:
    get:
      description: Paginated and always ordered by id.
      operationId: listFines
      parameters:
      - description: Only the fines of the loans of this member.
        in: query
        name: socioId
        required: false
        schema:
          type: integer
          format: int64
      - description: Only the fines in this status.
        in: query
        name: estado
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - PAID
      - description: "Page number, starting at 0."
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: "Page size, from 1 to 100."
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
