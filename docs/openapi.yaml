            application/json:
              examples:
                INTERNAL_ERROR:
                  $ref: "#/components/examples/INTERNAL_ERROR"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error. Possible codes: `INTERNAL_ERROR`."
      summary: Pay a fine
      tags:
      - Fines
  /api/v1/prestamos:
