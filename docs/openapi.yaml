        message: The member does not exist.
    METHOD_NOT_ALLOWED:
      summary: METHOD_NOT_ALLOWED
      value:
        code: METHOD_NOT_ALLOWED
        message: The HTTP method is not allowed for this endpoint.
    RENEWAL_LIMIT_REACHED:
      summary: RENEWAL_LIMIT_REACHED
      value:
        code: RENEWAL_LIMIT_REACHED
        message: The loan already used all its renewals.
    RENEWAL_NOT_ALLOWED_OVERDUE:
      summary: RENEWAL_NOT_ALLOWED_OVERDUE
      value:
        code: RENEWAL_NOT_ALLOWED_OVERDUE
        message: An overdue loan cannot be renewed. Return it first.
    UNSUPPORTED_MEDIA_TYPE:
      summary: UNSUPPORTED_MEDIA_TYPE
      value:
        code: UNSUPPORTED_MEDIA_TYPE
        message: The content type is not supported. Use application/json.
    VALIDATION_ERROR:
      summary: VALIDATION_ERROR
      value:
        code: VALIDATION_ERROR
        message: The request is not valid.
  schemas:
    Alerta:
      type: object
      properties:
        code:
          type: string
          enum:
          - DUE_SOON
          - OVERDUE
          - PENDING_FINE
          - LOW_SCORE
        message:
          type: string
      required:
      - code
      - message
    EjemplarRequest:
      type: object
      properties:
        codigo:
          type: string
          maxLength: 30
          minLength: 0
      required:
      - codigo
    EjemplarResponse:
      type: object
      properties:
        activo:
          type: boolean
          description: False when the copy was retired (damaged or lost).
        codigo:
          type: string
        disponible:
          type: boolean
          description: "Calculated: the copy is active and has no active loan. Never\
            \ stored."
        id:
          type: integer
          format: int64
        libroId:
          type: integer
          format: int64
      required:
      - activo
      - codigo
      - disponible
      - id
      - libroId
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Stable error code. See the catalog of the business rules.
          enum:
          - VALIDATION_ERROR
          - BOOK_NOT_FOUND
          - COPY_NOT_FOUND
          - MEMBER_NOT_FOUND
          - LOAN_NOT_FOUND
          - FINE_NOT_FOUND
          - ENDPOINT_NOT_FOUND
          - METHOD_NOT_ALLOWED
          - UNSUPPORTED_MEDIA_TYPE
          - COPY_ALREADY_ON_LOAN
          - LOAN_ALREADY_RETURNED
          - FINE_ALREADY_PAID
          - DUPLICATE_ISBN
          - DUPLICATE_EMAIL
          - DUPLICATE_COPY_CODE
          - BOOK_HAS_COPIES
          - COPY_HAS_HISTORY
          - COPY_HAS_ACTIVE_LOAN
          - MEMBER_HAS_HISTORY
          - MEMBER_HAS_ACTIVE_LOANS
          - CONCURRENT_UPDATE
          - MEMBER_INACTIVE
          - COPY_INACTIVE
          - MEMBER_HAS_OVERDUE_LOAN
          - MEMBER_HAS_PENDING_FINE
          - MEMBER_BLOCKED_BY_SCORE
          - LOAN_LIMIT_REACHED
          - RENEWAL_LIMIT_REACHED
          - RENEWAL_NOT_ALLOWED_OVERDUE
          - INTERNAL_ERROR
        message:
          type: string
      required:
      - code
      - message
    LibroRequest:
      type: object
      properties:
        anioPublicacion:
          type: integer
          format: int32
          maximum: 2100
          minimum: 1000
        autor:
          type: string
          maxLength: 150
          minLength: 0
        isbn:
          type: string
          maxLength: 20
          minLength: 0
        titulo:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - autor
      - isbn
      - titulo
    LibroResponse:
      type: object
      properties:
        anioPublicacion:
          type:
          - integer
          - "null"
          format: int32
          description: "Year of publication, when known."
        autor:
          type: string
        id:
          type: integer
          format: int64
        isbn:
          type: string
          description: "Stored without hyphens or spaces: 10 or 13 characters."
          example: "9780306406157"
        titulo:
          type: string
      required:
      - autor
      - id
      - isbn
      - titulo
    MultaResponse:
      type: object
      properties:
        diasRetraso:
          type: integer
          format: int32
          description: Days late that the fine charges.
          minimum: 1
        estado:
          type: string
          enum:
          - PENDING
          - PAID
        fechaGeneracion:
          type: string
          format: date
          description: "Day the fine was created: the day of the late return."
        fechaPago:
          type:
          - string
          - "null"
          format: date
          description: Day the fine was paid; null while it is pending.
        id:
          type: integer
          format: int64
        monto:
          type: number
          description: "Amount in soles: days late times the fine per day."
          example: 5.0
        prestamoId:
          type: integer
          format: int64
      required:
      - diasRetraso
      - estado
      - fechaGeneracion
      - id
      - monto
      - prestamoId
    PaginaDtoEjemplarResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EjemplarResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
    PaginaDtoLibroResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LibroResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
    PaginaDtoMultaResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MultaResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
    PaginaDtoPrestamoResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PrestamoResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
    PaginaDtoSocioResumen:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SocioResumen"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
    PrestamoRequest:
      type: object
      properties:
        ejemplarId:
          type: integer
          format: int64
          exclusiveMinimum: 0
        socioId:
          type: integer
          format: int64
          exclusiveMinimum: 0
      required:
      - ejemplarId
      - socioId
    PrestamoResponse:
      type: object
      properties:
        activo:
          type: boolean
          description: True while the copy has not been returned.
        alertas:
          type: array
          description: DUE_SOON or OVERDUE for an active loan; empty once returned.
          items:
            $ref: "#/components/schemas/Alerta"
        diasRetraso:
          type: integer
          format: int32
          description: "Days late as of today for an active loan, or up to the return\
            \ date for a returned one. Zero when on time."
          minimum: 0
        ejemplarId:
          type: integer
          format: int64
        fechaDevolucion:
          type:
          - string
          - "null"
          format: date
          description: Day the copy was returned; null while the loan is active.
        fechaPrestamo:
          type: string
          format: date
          description: "Day the loan started, set by the server."
        fechaVencimiento:
          type: string
          format: date
          description: Last day to return without a fine. Each renewal moves it forward.
        id:
          type: integer
          format: int64
        multa:
          description: The fine created by a late return; null when the loan was on
            time or is still active.
          oneOf:
          - $ref: "#/components/schemas/MultaResponse"
          - type: "null"
        renovaciones:
          type: integer
          format: int32
          description: Renewals used so far.
          maximum: 3
          minimum: 0
        socioId:
          type: integer
          format: int64
      required:
      - activo
      - alertas
      - diasRetraso
      - ejemplarId
      - fechaPrestamo
      - fechaVencimiento
      - id
      - renovaciones
      - socioId
    SocioRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 150
          minLength: 0
        nombre:
          type: string
          maxLength: 120
          minLength: 0
      required:
      - email
      - nombre
    SocioResponse:
      type: object
      properties:
        activo:
          type: boolean
        alertas:
          type: array
          description: "PENDING_FINE and LOW_SCORE, calculated now."
          items:
            $ref: "#/components/schemas/Alerta"
        email:
          type: string
        fechaRegistro:
          type: string
          format: date
          description: "Day of registration, set by the server."
        id:
          type: integer
          format: int64
        nombre:
          type: string
        score:
          type: integer
          format: int32
          description: "Reliability score from 0 to 100, calculated from the loan\
            \ history. It only goes down."
          maximum: 100
          minimum: 0
      required:
      - activo
      - alertas
      - email
      - fechaRegistro
      - id
      - nombre
      - score
    SocioResumen:
      type: object
      properties:
        activo:
          type: boolean
        email:
          type: string
        fechaRegistro:
          type: string
          format: date
        id:
          type: integer
          format: int64
        nombre:
          type: string
      required:
      - activo
      - email
      - fechaRegistro
      - id
      - nombre
