              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error. Possible codes: `COPY_NOT_FOUND`."
        "409":
          content:
            application/json:
              examples:
                CONCURRENT_UPDATE:
                  $ref: "#/components/examples/CONCURRENT_UPDATE"
                COPY_HAS_ACTIVE_LOAN:
                  $ref: "#/components/examples/COPY_HAS_ACTIVE_LOAN"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error. Possible codes: `COPY_HAS_ACTIVE_LOAN`, `CONCURRENT_UPDATE`."
        "500":
          content:
            application/json:
              examples:
                INTERNAL_ERROR:
                  $ref: "#/components/examples/INTERNAL_ERROR"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error. Possible codes: `INTERNAL_ERROR`."
      summary: Retire a copy
      tags:
      - Copies
  /api/v1/libros:
    get:
      description: Paginated and always ordered by id. A sort parameter is ignored.
      operationId: listBooks
      parameters:
      - description: "Text that the title or the author must contain, ignoring case.\
          \ `%` and `_` are literal."
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: "Page number, starting at 0."
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: "Page size, from 1 to 100."
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginaDtoLibroResponse"
          description: OK
        "400":
          content:
            application/json:
              examples:
                VALIDATION_ERROR:
                  $ref: "#/components/examples/VALIDATION_ERROR"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error. Possible codes: `VALIDATION_ERROR`."
        "500":
          content:
            application/json:
              examples:
                INTERNAL_ERROR:
                  $ref: "#/components/examples/INTERNAL_ERROR"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error. Possible codes: `INTERNAL_ERROR`."
      summary: List books
      tags:
      - Books
    post:
      description: The ISBN may be written with hyphens or spaces; it is stored as
        10 or 13 characters (a 10-digit ISBN may end in X).
      operationId: createBook
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibroRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LibroResponse"
          description: Created.
          headers:
            Location:
              description: URL of the created resource.
              schema:
                type: string
        "400":
          content:
            application/json:
              examples:
                VALIDATION_ERROR:
                  $ref: "#/components/examples/VALIDATION_ERROR"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error. Possible codes: `VALIDATION_ERROR`."
        "409":
          content:
            application/json:
              examples:
                DUPLICATE_ISBN:
                  $ref: "#/components/examples/DUPLICATE_ISBN"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error. Possible codes: `DUPLICATE_ISBN`."
        "415":
          content:
            application/json:
              examples:
                UNSUPPORTED_MEDIA_TYPE:
