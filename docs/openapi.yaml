openapi: 3.1.0
info:
  description: |
    REST API of a small library: books, copies, members, loans, renewals, returns and fines.
    All data is fictional.

    **Errors.** Every failure answers `{ "code": "...", "message": "..." }`. The `code` is stable and meant for programs; the `message` is English text for people. Each operation lists the codes it can return.

    **Dates** are days (`yyyy-MM-dd`) in the `America/Lima` zone and always come from the server, never from the client.

    **Calculated, never stored:** the member score and alerts, the loan alerts and the copy availability.
  license:
    name: MIT
    url: https://opensource.org/license/mit
  title: Biblioteca API
  version: 0.1.0
servers:
- description: Local development
  url: http://localhost:8080
tags:
- description: "Titles of the catalog, identified by ISBN."
  name: Books
- description: Physical copies of a book. Loans are made on copies.
  name: Copies
- description: "People who can borrow, with their score and alerts."
  name: Members
- description: "Lending, renewing and returning a copy."
  name: Loans
- description: Fines created by late returns.
  name: Fines
paths:
  /api/v1/ejemplares/{id}:
    delete:
      description: "A copy that appears in any loan is never deleted, only retired."
      operationId: deleteCopy
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Deleted.
        "400":
          content:
            application/json:
              examples:
                VALIDATION_ERROR:
                  $ref: "#/components/examples/VALIDATION_ERROR"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error. Possible codes: `VALIDATION_ERROR`."
        "404":
          content:
            application/json:
              examples:
                COPY_NOT_FOUND:
                  $ref: "#/components/examples/COPY_NOT_FOUND"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error. Possible codes: `COPY_NOT_FOUND`."
        "409":
          content:
            application/json:
              examples:
                CONCURRENT_UPDATE:
                  $ref: "#/components/examples/CONCURRENT_UPDATE"
                COPY_HAS_HISTORY:
                  $ref: "#/components/examples/COPY_HAS_HISTORY"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error. Possible codes: `COPY_HAS_HISTORY`, `CONCURRENT_UPDATE`."
        "500":
          content:
            application/json:
              examples:
                INTERNAL_ERROR:
                  $ref: "#/components/examples/INTERNAL_ERROR"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error. Possible codes: `INTERNAL_ERROR`."
      summary: Delete a copy
      tags:
      - Copies
    get:
      description: "`disponible` is calculated: the copy is active and has no active\
        \ loan."
      operationId: getCopy
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EjemplarResponse"
          description: OK
        "400":
          content:
            application/json:
              examples:
                VALIDATION_ERROR:
                  $ref: "#/components/examples/VALIDATION_ERROR"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error. Possible codes: `VALIDATION_ERROR`."
        "404":
          content:
            application/json:
              examples:
                COPY_NOT_FOUND:
                  $ref: "#/components/examples/COPY_NOT_FOUND"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error. Possible codes: `COPY_NOT_FOUND`."
        "500":
          content:
            application/json:
              examples:
                INTERNAL_ERROR:
                  $ref: "#/components/examples/INTERNAL_ERROR"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error. Possible codes: `INTERNAL_ERROR`."
      summary: Get a copy
      tags:
      - Copies
  /api/v1/ejemplares/{id}/alta:
    post:
      operationId: restoreCopy
      parameters:
      - in: path
        name: id
        required: true
        schema:
